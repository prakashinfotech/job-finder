<svg viewBox="0 0 800 550" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Job search illustration">

  <!-- Ground shadow -->
  <ellipse cx="400" cy="490" rx="320" ry="40" fill="#F5C518" opacity="0.85"/>

  <!-- ===== LEFT WOMAN (navy suit) ===== -->
  <g transform="translate(60,150)">
    <!-- legs -->
    <rect x="20" y="230" width="18" height="100" rx="6" fill="#1a237e"/>
    <rect x="44" y="230" width="18" height="100" rx="6" fill="#1a237e"/>
    <!-- body -->
    <rect x="10" y="130" width="72" height="110" rx="12" fill="#1a237e"/>
    <!-- lapels -->
    <polygon points="46,130 30,160 46,155" fill="#fff" opacity="0.5"/>
    <polygon points="46,130 62,160 46,155" fill="#fff" opacity="0.3"/>
    <!-- left arm -->
    <rect x="-10" y="135" width="18" height="80" rx="8" fill="#1a237e"/>
    <!-- right arm -->
    <rect x="74" y="135" width="18" height="80" rx="8" fill="#1a237e"/>
    <!-- neck -->
    <rect x="34" y="110" width="24" height="25" rx="8" fill="#f5cba7"/>
    <!-- head -->
    <circle cx="46" cy="90" r="38" fill="#3d2b1f"/>
    <circle cx="46" cy="95" r="30" fill="#f5cba7"/>
    <!-- hair -->
    <ellipse cx="46" cy="68" rx="30" ry="18" fill="#1a1a1a"/>
    <!-- bun -->
    <ellipse cx="46" cy="56" rx="14" ry="10" fill="#1a1a1a"/>
  </g>

  <!-- ===== LEFT-CENTER MAN (white shirt, dark pants) ===== -->
  <g transform="translate(195,140)">
    <!-- legs -->
    <rect x="18" y="235" width="20" height="105" rx="6" fill="#212121"/>
    <rect x="44" y="235" width="20" height="105" rx="6" fill="#212121"/>
    <!-- body -->
    <rect x="8" y="125" width="78" height="115" rx="12" fill="#eceff1"/>
    <!-- tie -->
    <polygon points="47,125 43,180 47,185 51,180" fill="#1565c0"/>
    <!-- left arm reaching forward -->
    <rect x="-18" y="130" width="22" height="90" rx="9" fill="#eceff1" transform="rotate(-20,-18,130)"/>
    <!-- right arm -->
    <rect x="78" y="130" width="22" height="85" rx="9" fill="#eceff1"/>
    <!-- neck -->
    <rect x="32" y="105" width="24" height="25" rx="8" fill="#f5cba7"/>
    <!-- head -->
    <circle cx="44" cy="85" r="32" fill="#f5cba7"/>
    <!-- hair -->
    <ellipse cx="44" cy="62" rx="28" ry="16" fill="#1a1a1a"/>
  </g>

  <!-- ===== MAGNIFYING GLASS ===== -->
  <g transform="translate(230,60)">
    <!-- glass circle fill (light) -->
    <circle cx="185" cy="185" r="155" fill="#e3f2fd" opacity="0.55"/>
    <!-- glass circle border -->
    <circle cx="185" cy="185" r="155" fill="none" stroke="#0d1b6e" stroke-width="28"/>
    <!-- handle -->
    <rect x="58" y="295" width="38" height="160" rx="19" fill="#00bcd4" transform="rotate(-45,58,295)"/>
    <!-- handle end cap -->
    <circle cx="18" cy="370" r="20" fill="#00bcd4"/>
  </g>

  <!-- ===== PHONE / DOOR (inside magnifier) ===== -->
  <g transform="translate(350,110)">
    <rect x="0" y="0" width="100" height="220" rx="14" fill="#b2ebf2" opacity="0.7" stroke="#00bcd4" stroke-width="4"/>
    <!-- door shine -->
    <rect x="10" y="10" width="30" height="200" rx="8" fill="#fff" opacity="0.25"/>
  </g>

  <!-- ===== CENTER-LEFT WOMAN (teal, inside magnifier, handshake) ===== -->
  <g transform="translate(295,195)">
    <!-- legs -->
    <rect x="14" y="195" width="16" height="90" rx="6" fill="#1565c0"/>
    <rect x="34" y="195" width="16" height="90" rx="6" fill="#0d47a1"/>
    <!-- skirt -->
    <ellipse cx="36" cy="198" rx="28" ry="12" fill="#0288d1"/>
    <!-- body -->
    <rect x="6" y="100" width="64" height="100" rx="10" fill="#00acc1"/>
    <!-- briefcase -->
    <rect x="-20" y="170" width="32" height="24" rx="5" fill="#37474f"/>
    <rect x="-14" y="165" width="20" height="8" rx="4" fill="#546e7a"/>
    <!-- right arm reaching right -->
    <rect x="62" y="110" width="18" height="70" rx="8" fill="#00acc1" transform="rotate(15,62,110)"/>
    <!-- left arm down with bag -->
    <rect x="-10" y="110" width="18" height="65" rx="8" fill="#00acc1"/>
    <!-- neck -->
    <rect x="24" y="84" width="20" height="20" rx="7" fill="#f5cba7"/>
    <!-- head -->
    <circle cx="34" cy="65" r="28" fill="#f5cba7"/>
    <!-- hair -->
    <ellipse cx="34" cy="46" rx="24" ry="14" fill="#5d4037"/>
    <!-- bun -->
    <circle cx="34" cy="36" rx="11" fill="#5d4037"/>
  </g>

  <!-- ===== RIGHT-CENTER MAN (blue tie, handshake) ===== -->
  <g transform="translate(430,145)">
    <!-- legs -->
    <rect x="16" y="230" width="20" height="100" rx="6" fill="#212121"/>
    <rect x="42" y="230" width="20" height="100" rx="6" fill="#212121"/>
    <!-- body -->
    <rect x="5" y="120" width="78" height="115" rx="12" fill="#eceff1"/>
    <!-- tie -->
    <polygon points="44,120 40,175 44,180 48,175" fill="#1565c0"/>
    <!-- left arm reaching toward magnifier -->
    <rect x="-22" y="125" width="22" height="80" rx="9" fill="#eceff1" transform="rotate(-15,-22,125)"/>
    <!-- right arm -->
    <rect x="76" y="125" width="22" height="80" rx="9" fill="#eceff1"/>
    <!-- neck -->
    <rect x="30" y="100" width="24" height="25" rx="8" fill="#f5cba7"/>
    <!-- head -->
    <circle cx="42" cy="80" r="32" fill="#f5cba7"/>
    <!-- hair -->
    <ellipse cx="42" cy="58" rx="28" ry="16" fill="#1a1a1a"/>
  </g>

  <!-- ===== RIGHT MAN (light blue shirt, clipboard) ===== -->
  <g transform="translate(590,155)">
    <!-- legs -->
    <rect x="16" y="228" width="20" height="100" rx="6" fill="#212121"/>
    <rect x="42" y="228" width="20" height="100" rx="6" fill="#212121"/>
    <!-- body -->
    <rect x="5" y="118" width="76" height="115" rx="12" fill="#64b5f6"/>
    <!-- clipboard -->
    <rect x="68" y="120" width="42" height="55" rx="5" fill="#fafafa" stroke="#bbb" stroke-width="2"/>
    <rect x="80" y="113" width="18" height="12" rx="4" fill="#9e9e9e"/>
    <!-- lines on clipboard -->
    <rect x="74" y="135" width="30" height="4" rx="2" fill="#ccc"/>
    <rect x="74" y="146" width="24" height="4" rx="2" fill="#ccc"/>
    <rect x="74" y="157" width="28" height="4" rx="2" fill="#ccc"/>
    <!-- right arm holding clipboard -->
    <rect x="66" y="122" width="20" height="60" rx="9" fill="#64b5f6"/>
    <!-- left arm -->
    <rect x="-12" y="122" width="20" height="75" rx="9" fill="#64b5f6"/>
    <!-- neck -->
    <rect x="28" y="98" width="24" height="25" rx="8" fill="#f5cba7"/>
    <!-- head -->
    <circle cx="40" cy="78" r="32" fill="#f5cba7"/>
    <!-- hair -->
    <ellipse cx="40" cy="56" rx="28" ry="16" fill="#1a1a1a"/>
  </g>

</svg>
